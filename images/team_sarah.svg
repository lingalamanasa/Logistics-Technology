<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sarah" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="suit-sarah" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <clipPath id="circle-clip-sarah">
      <circle cx="100" cy="100" r="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#circle-clip-sarah)">
    <!-- Background Circle -->
    <rect width="200" height="200" fill="url(#bg-sarah)"/>
    <circle cx="100" cy="100" r="85" fill="#4338CA" opacity="0.3"/>

    <!-- Long Hair Backing -->
    <path d="M55 70 C55 120 58 175 66 200 L134 200 C142 175 145 120 145 70 Z" fill="#18181B"/>

    <!-- Body & Blazer -->
    <path d="M30 200 C30 158 60 146 100 146 C140 146 170 158 170 200 Z" fill="url(#suit-sarah)"/>

    <!-- Inner Coral Silk Blouse -->
    <polygon points="100,146 86,175 100,195 114,175" fill="#E11D48"/>

    <!-- Blazer Lapels -->
    <path d="M68 152 L92 186 L80 200 L42 200 Z" fill="#1F2937"/>
    <path d="M132 152 L108 186 L120 200 L158 200 Z" fill="#1F2937"/>

    <!-- Neck & Collarbone -->
    <rect x="88" y="118" width="24" height="30" rx="3" fill="#FBD38D"/>

    <!-- Head & Ears -->
    <circle cx="68" cy="100" r="8.5" fill="#FBD38D"/>
    <circle cx="132" cy="100" r="8.5" fill="#FBD38D"/>
    <!-- Pearl Earrings -->
    <circle cx="68" cy="104" r="3.5" fill="#FFFFFF"/>
    <circle cx="132" cy="104" r="3.5" fill="#FFFFFF"/>
    
    <ellipse cx="100" cy="96" rx="32" ry="38" fill="#FEEBC8"/>

    <!-- Modern Bob Hair Cut / Front Waves -->
    <path d="M64 88 C60 52 74 46 100 46 C126 46 140 52 136 88 C134 70 128 58 100 58 C72 58 66 70 64 88 Z" fill="#27272A"/>
    <path d="M62 82 Q74 54 100 52 Q126 54 138 82 Q126 62 100 60 Q74 62 62 82 Z" fill="#18181B"/>
    <path d="M62 82 C60 106 66 135 72 145 C67 125 64 105 66 85 Z" fill="#27272A"/>
    <path d="M138 82 C140 106 134 135 128 145 C133 125 136 105 134 85 Z" fill="#27272A"/>

    <!-- Eyebrows -->
    <path d="M76 80 Q84 76 92 80" stroke="#18181B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M108 80 Q116 76 124 80" stroke="#18181B" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Eyes (Warm & Intelligent) -->
    <ellipse cx="84" cy="89" rx="4.5" ry="3" fill="#18181B"/>
    <ellipse cx="116" cy="89" rx="4.5" ry="3" fill="#18181B"/>
    <circle cx="85.5" cy="88" r="1.3" fill="#FFFFFF"/>
    <circle cx="117.5" cy="88" r="1.3" fill="#FFFFFF"/>

    <!-- Eyeliner & Lashes -->
    <path d="M78 87 Q84 84 90 87" stroke="#09090B" stroke-width="1.5" fill="none"/>
    <path d="M110 87 Q116 84 122 87" stroke="#09090B" stroke-width="1.5" fill="none"/>

    <!-- Nose -->
    <path d="M100 87 L98 102 Q100 104 102 102" stroke="#DD6B20" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Smile (Rose Lipstick) -->
    <path d="M89 116 Q100 124 111 116" stroke="#E11D48" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <circle cx="100" cy="100" r="97" fill="none" stroke="rgba(139,0,0,0.4)" stroke-width="3"/>
</svg>
