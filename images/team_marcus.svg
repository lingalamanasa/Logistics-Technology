<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-marcus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="suit-marcus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <clipPath id="circle-clip-marcus">
      <circle cx="100" cy="100" r="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#circle-clip-marcus)">
    <!-- Background Circle -->
    <rect width="200" height="200" fill="url(#bg-marcus)"/>
    <circle cx="100" cy="100" r="85" fill="#3B82F6" opacity="0.25"/>

    <!-- Body & Modern Charcoal Jacket -->
    <path d="M30 200 C30 156 58 144 100 144 C142 144 170 156 170 200 Z" fill="url(#suit-marcus)"/>

    <!-- Navy Fitted Crewneck / Shirt -->
    <path d="M84 144 Q100 162 116 144 L114 180 Q100 186 86 180 Z" fill="#0F172A"/>

    <!-- Jacket Collar Accents -->
    <path d="M68 152 L88 184 L76 200 L40 200 Z" fill="#1E293B"/>
    <path d="M132 152 L112 184 L124 200 L160 200 Z" fill="#1E293B"/>

    <!-- Neck -->
    <rect x="86" y="116" width="28" height="32" rx="3" fill="#C68B59"/>

    <!-- Head & Ears -->
    <circle cx="66" cy="96" r="9.5" fill="#C68B59"/>
    <circle cx="134" cy="96" r="9.5" fill="#C68B59"/>
    <ellipse cx="100" cy="94" rx="34" ry="40" fill="#D99B66"/>

    <!-- Short Modern Fade Haircut -->
    <path d="M66 84 C65 52 78 44 100 44 C122 44 135 52 134 84 C132 66 124 54 100 54 C76 54 68 66 66 84 Z" fill="#18181B"/>
    <path d="M66 80 Q80 50 100 48 Q120 50 134 80 Q122 56 100 54 Q78 56 66 80 Z" fill="#27272A"/>

    <!-- Well-groomed Stubble / Short Beard -->
    <path d="M72 98 C72 128 84 138 100 138 C116 138 128 128 128 98 C128 106 124 132 100 132 C76 132 72 106 72 98 Z" fill="#18181B" opacity="0.35"/>

    <!-- Eyebrows -->
    <rect x="76" y="78" width="16" height="4" rx="2" fill="#18181B" transform="rotate(-4 84 80)"/>
    <rect x="108" y="78" width="16" height="4" rx="2" fill="#18181B" transform="rotate(4 116 80)"/>

    <!-- Eyes -->
    <circle cx="84" cy="88" r="4.2" fill="#1E293B"/>
    <circle cx="116" cy="88" r="4.2" fill="#1E293B"/>
    <circle cx="85.5" cy="87" r="1.3" fill="#FFFFFF"/>
    <circle cx="117.5" cy="87" r="1.3" fill="#FFFFFF"/>

    <!-- Nose -->
    <path d="M100 85 L97 102 L103 102" stroke="#A05A2C" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Smile -->
    <path d="M89 116 Q100 125 111 116" stroke="#78350F" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <circle cx="100" cy="100" r="97" fill="none" stroke="rgba(139,0,0,0.4)" stroke-width="3"/>
</svg>
